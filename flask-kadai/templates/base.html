
<!DOCTYPE html>
<html lang="ja">

<!-- ー -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>そだてて図鑑</title>

    <!-- Bootstrap CSS 
     （WebサイトやWebページのデザイン・レイアウトを効率よく作るためのCSSフレームワーク）-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <!-- 自分で作るCSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<!-- ＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝ -->

<!-- メモ： -->
  <!-- game-navbar：ナビゲーションバーのデザイン用
       game-logo：左上のタイトル部分
       game-nav-link：ナビゲーションのリンク部分
       page-container：ページ全体の配置
       game-screen：各ページの内容を囲むゲーム画面 -->

<!-- ボディ -->
<body>

    <!-- ヘッダー -->
    {% if current_user.is_authenticated %}
    <nav class="navbar navbar-expand-lg game-navbar">
        <div class="container">

            <a class="navbar-brand game-logo"
               href="{{ url_for('ikimono.index') }}">
                🌱 そだてて図鑑
            </a>

    <!-- ⇓button メモ： -->
            <!-- class="navbar-toggler" スマホ、画面が狭くなっても大丈夫にする -->
            <!-- type="button"	フォーム送信（submit）ではなく、単なるクリックボタンとして機能させるための指定。 -->
            <!-- data-bs-toggle="collapse"	クリック時に「折りたたみ（Collapse）」起動 -->
            <!-- data-bs-target="#navbarNav"	開閉する対象を指定。ここで指定した #navbarNav と同じ id="navbarNav" を持つ要素が開閉される。 -->
            <!-- aria-expanded="false"	メニューの現在の開閉状態を表します（初期状態は閉じているので false、開くと自動で true に変わる） -->

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-expanded="false">

                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- ヘッダーメニューを作成するためのコンテナ -->
                <ul class="navbar-nav ms-auto">
                    <!-- 右寄せ -->

                    <li class="nav-item">
                        <!-- Bootstrap でナビゲーションメニューの各項目を表すためのHTML -->
                        <a class="nav-link game-nav-link"
                           href="{{ url_for('ikimono.index') }}">
                            ホーム
                        </a>
                        <!-- CSSやJavaScriptでデザイン・動きを適用するためのクラス名 -->
                    </li>

                    <li class="nav-item">
                        <a class="nav-link game-nav-link"
                           href="{{ url_for('ikimono.zukan') }}">
                            図鑑
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link game-nav-link"
                           href="{{ url_for('memo.index') }}">
                            メモ
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link game-nav-link"
                           href="{{ url_for('auth.logout') }}">
                            ログアウト
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    {% endif %}

    <!-- メインコンテンツ -->
    <main class="page-container">
        <!-- 最大幅や中央寄せ、左右の余白などをCSSで制御するためのクラス名 -->
        <div class="container">
            <!-- 複数の要素をひとまとめにし、CSSで横幅や中央寄せなどのレイアウトを一括管理するための箱 -->

            <div class="game-screen">
                <!-- ゲーム画面全体をまとめるコンテナとしてよく使われる -->
                {% block content %}{% endblock %}
            </div>

        </div>
    </main>

    <!-- Bootstrap JS（属性を指定するだけで動作するデータ属性） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>

</body>
<!-- ＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝＝ -->

</html>
